
    <svg
      [attr.aria-hidden]="true"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      [style.width.em]="size()"
      [style.height.em]="size()"
    >
      @for (p of paths(); track $index) {
        <path [attr.d]="p.d" [attr.stroke-width]="p.stroke ?? 1.5" />
      }
    </svg>
